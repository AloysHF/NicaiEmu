<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicaiEmu - Nicai/MStar CBE Game Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #e94560, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #f39c12;
        }

        .message {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 2rem;
        }

        .progress {
            width: 300px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto 2rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12);
            width: 30%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .links a {
            color: #e94560;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #e94560;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .links a:hover {
            background: #e94560;
            color: #fff;
        }

        .footer {
            position: fixed;
            bottom: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">NicaiEmu</div>
        <div class="subtitle">Nicai/MStar CBE Game Emulator</div>
        <div class="status">Under Development</div>
        <div class="message">Coming Soon - Stay Tuned!</div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <div class="links">
            <a href="https://github.com/AloysCFD/NicaiEmu">GitHub</a>
        </div>
    </div>
    <div class="footer">
        &copy; 2024 NicaiEmu. Built with Rust.
    </div>
</body>
</html>
